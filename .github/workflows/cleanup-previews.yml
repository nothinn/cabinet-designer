# This workflow is disabled because the preview system now uses dynamic loading
# from raw.githubusercontent.com instead of static deployments.
#
# Previews are loaded on-demand via preview.html?branch=... or preview.html?pr=...
# so there are no static preview directories to clean up.
#
# If you need to re-enable static preview deployments in the future,
# you can uncomment and update this workflow.

name: Cleanup Old Previews (Disabled)

on:
  workflow_dispatch:  # Only allow manual triggering if needed

permissions:
  contents: read

jobs:
  cleanup-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow Disabled
        run: |
          echo "⚠️  This workflow is disabled."
          echo "The preview system now uses dynamic loading, so there are no static directories to clean up."
          echo "Previews are loaded from raw.githubusercontent.com on-demand."
          exit 0