# This workflow is disabled because the preview index now loads data on-demand
# from the GitHub API when users visit preview-index.html.
#
# There's no need to pre-generate previews.json since the preview system
# is fully dynamic and fetches branch/PR data directly from GitHub.
#
# If you need to re-enable static preview index generation in the future,
# you can uncomment and update this workflow.

name: Update Preview Index (Disabled)

on:
  workflow_dispatch:  # Only allow manual triggering if needed

permissions:
  contents: read

jobs:
  update-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow Disabled
        run: |
          echo "⚠️  This workflow is disabled."
          echo "The preview index now loads branch/PR data on-demand from GitHub API."
          echo "No pre-generated previews.json file is needed."
          exit 0