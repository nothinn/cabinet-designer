name: Preview Comment on PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "preview-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  preview-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Determine preview URL
        id: preview-url
        run: |
          echo "PREVIEW_URL=https://nothinn.github.io/cabinet-designer/preview.html?pr=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "BRANCH_PREVIEW_URL=https://nothinn.github.io/cabinet-designer/preview.html?branch=${{ github.head_ref }}" >> $GITHUB_ENV

      - name: Comment PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const headRef = context.payload.pull_request.head.ref;
            const previewUrl = process.env.PREVIEW_URL;
            const branchPreviewUrl = process.env.BRANCH_PREVIEW_URL;

            const comment = `## 🚀 Preview Available

            Your changes are available for preview:

            - **PR Preview**: [View Preview](${previewUrl})
            - **Branch Preview**: [View Branch](${branchPreviewUrl})
            - **Preview Index**: [All Previews](https://nothinn.github.io/cabinet-designer/preview-index.html)

            The preview loads dynamically from the latest commit on your branch.

            ---
            *This preview is automatically updated when you push new commits.*`;

            // Find existing preview comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('🚀 Preview Available')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }